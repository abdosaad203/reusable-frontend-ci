name: Reusable Frontend CI

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

      run-tests:
        required: true
        type: boolean

      image-name:
        required: true
        type: string

jobs:

  gitleaks-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1

  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=high || true

  build-test:
    runs-on: ubuntu-latest

    needs:
      - gitleaks-scan
      - semgrep-scan
      - dependency-check

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Run tests
        if: ${{ inputs.run-tests }}
        run: npm test -- --watch=false --browsers=ChromeHeadless

  docker-build-push:
    runs-on: ubuntu-latest

    needs: build-test

    permissions:
      contents: read
      packages: write

    if: github.event_name == 'push'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  trivy-config-scan:
    runs-on: ubuntu-latest

    needs: docker-build-push

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          format: json
          output: trivy-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-config-report
          path: trivy-report.json

  trivy-image-scan:
    runs-on: ubuntu-latest

    needs: docker-build-push

    steps:
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:latest
          format: json
          output: trivy-image-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.json

  zap-scan:
    runs-on: ubuntu-latest

    needs: docker-build-push

    services:
      frontend:
        image: ghcr.io/${{ github.repository_owner }}/frontend:latest
        ports:
          - 3000:3000

    steps:
      - name: Wait for app
        run: |
          echo "Waiting for frontend..."
          sleep 30

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://frontend:3000'
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Upload ZAP report to DefectDojo
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "scan_type=ZAP Scan" \
            -F "file=@report_json.json" \
            -F "active=true" \
            -F "verified=true"

  publish-security-reports:
    runs-on: ubuntu-latest

    needs:
      - trivy-config-scan
      - trivy-image-scan
      - zap-scan
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: trivy-config-report

      - uses: actions/download-artifact@v4
        with:
          name: trivy-image-report

      - name: Upload Trivy Config report
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
          -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
          -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
          -F "scan_type=Trivy Config Scan" \
          -F "file=@trivy-report.json" \
          -F "active=true" \
          -F "verified=true" 

      - name: Upload Trivy Image report
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
          -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
          -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
          -F "scan_type=Trivy Scan" \
          -F "file=@trivy-image-report.json" \
          -F "active=true" \
          -F "verified=true"